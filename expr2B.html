<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReMarket - Used Products</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    color:#222;
}

/* HEADER */
header{
    background:#182848;
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

header button{
    border:0;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    background:#ffca28;
    color:#222;
    font-weight:bold;
}

/* HERO */
.hero{
    background:linear-gradient(120deg,#182848,#4b6cb7);
    color:white;
    text-align:center;
    padding:55px 20px;
}

.hero h1{
    font-size:35px;
    margin-bottom:10px;
}

.hero p{
    margin-bottom:25px;
}

.search{
    width:90%;
    max-width:600px;
    padding:15px 20px;
    border:0;
    border-radius:30px;
    font-size:16px;
    outline:none;
}

/* CATEGORY */
.categories{
    padding:25px 7%;
    text-align:center;
}

.categories button{
    margin:6px;
    padding:9px 16px;
    border:1px solid #4b6cb7;
    background:white;
    color:#182848;
    border-radius:20px;
    cursor:pointer;
}

/* PRODUCTS */
.products{
    padding:15px 7% 40px;
}

.products h2{
    margin-bottom:20px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.product-image{
    height:150px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:65px;
    background:#eef1f7;
}

.card-content{
    padding:18px;
}

.card h3{
    margin-bottom:8px;
}

.category{
    color:#777;
    font-size:14px;
}

.price{
    color:#182848;
    font-size:21px;
    font-weight:bold;
    margin:10px 0;
}

.condition{
    display:inline-block;
    background:#e8f5e9;
    color:#218838;
    padding:5px 9px;
    border-radius:5px;
    font-size:13px;
}

.card button{
    width:100%;
    margin-top:14px;
    padding:11px;
    border:0;
    border-radius:7px;
    background:#182848;
    color:white;
    cursor:pointer;
}

/* SELL BOX */
.sell-section{
    padding:30px 7%;
}

.sell-box{
    background:white;
    max-width:700px;
    margin:auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.sell-box h2{
    margin-bottom:20px;
}

.sell-box input,
.sell-box select,
.sell-box textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:7px;
}

.sell-box textarea{
    height:90px;
    resize:none;
}

.sell-box button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:7px;
    background:#ffca28;
    cursor:pointer;
    font-weight:bold;
}

/* FOOTER */
footer{
    background:#182848;
    color:white;
    text-align:center;
    padding:22px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
    <div class="logo">♻️ ReMarket</div>
    <button onclick="goSell()">Sell Product</button>
</header>

<section class="hero">
    <h1>Buy Smart. Sell Easy.</h1>
    <p>Find useful second-hand products at affordable prices.</p>

    <input
        class="search"
        id="searchBox"
        placeholder="🔍 Search used products..."
        onkeyup="searchProducts()"
    >
</section>

<section class="categories">

    <button onclick="filterCategory('All')">All</button>
    <button onclick="filterCategory('Electronics')">📱 Electronics</button>
    <button onclick="filterCategory('Furniture')">🪑 Furniture</button>
    <button onclick="filterCategory('Books')">📚 Books</button>
    <button onclick="filterCategory('Vehicles')">🚲 Vehicles</button>

</section>

<section class="products">

    <h2>⭐ Latest Listings</h2>

    <div class="product-grid" id="productList"></div>

</section>

<section class="sell-section" id="sellSection">

    <div class="sell-box">

        <h2>📦 Sell Your Used Product</h2>

        <input
            type="text"
            id="productName"
            placeholder="Product name"
        >

        <select id="productCategory">
            <option value="">Select category</option>
            <option>Electronics</option>
            <option>Furniture</option>
            <option>Books</option>
            <option>Vehicles</option>
        </select>

        <input
            type="number"
            id="productPrice"
            placeholder="Price ₹"
        >

        <select id="productCondition">
            <option value="">Select condition</option>
            <option>Like New</option>
            <option>Good</option>
            <option>Used</option>
        </select>

        <textarea
            id="productDescription"
            placeholder="Describe your product..."
        ></textarea>

        <button onclick="addProduct()">
            + Publish Listing
        </button>

    </div>

</section>

<footer>
    © 2026 ReMarket | Buy & Sell Used Products
</footer>


<script>

let products = [

    {
        name:"Smartphone",
        category:"Electronics",
        price:8500,
        condition:"Good",
        icon:"📱"
    },

    {
        name:"Study Table",
        category:"Furniture",
        price:2500,
        condition:"Like New",
        icon:"🪑"
    },

    {
        name:"Programming Books",
        category:"Books",
        price:700,
        condition:"Good",
        icon:"📚"
    },

    {
        name:"Mountain Bicycle",
        category:"Vehicles",
        price:6000,
        condition:"Used",
        icon:"🚲"
    },

    {
        name:"Bluetooth Speaker",
        category:"Electronics",
        price:1200,
        condition:"Good",
        icon:"🔊"
    },

    {
        name:"Office Chair",
        category:"Furniture",
        price:1800,
        condition:"Used",
        icon:"💺"
    }

];


/* DISPLAY PRODUCTS */

function displayProducts(list){

    let container =
        document.getElementById("productList");

    container.innerHTML="";

    if(list.length===0){

        container.innerHTML=
        "<p>No products found.</p>";

        return;
    }

    list.forEach((product,index)=>{

        container.innerHTML += `

        <div class="card">

            <div class="product-image">
                ${product.icon}
            </div>

            <div class="card-content">

                <h3>${product.name}</h3>

                <p class="category">
                    ${product.category}
                </p>

                <p class="price">
                    ₹${product.price}
                </p>

                <span class="condition">
                    ${product.condition}
                </span>

                <button onclick="contactSeller('${product.name}')">
                    Contact Seller
                </button>

            </div>

        </div>

        `;

    });

}


/* SEARCH */

function searchProducts(){

    let text =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    let result =
        products.filter(product =>
            product.name.toLowerCase().includes(text) ||
            product.category.toLowerCase().includes(text)
        );

    displayProducts(result);

}


/* CATEGORY FILTER */

function filterCategory(category){

    if(category==="All"){

        displayProducts(products);

        return;
    }

    let result =
        products.filter(product =>
            product.category===category
        );

    displayProducts(result);

}


/* CONTACT SELLER */

function contactSeller(name){

    alert(
        "Seller contact request sent!\n\n" +
        "Product: " + name
    );

}


/* ADD NEW PRODUCT */

function addProduct(){

    let name =
        document.getElementById("productName").value;

    let category =
        document.getElementById("productCategory").value;

    let price =
        document.getElementById("productPrice").value;

    let condition =
        document.getElementById("productCondition").value;

    let description =
        document.getElementById("productDescription").value;


    if(name==="" ||
       category==="" ||
       price==="" ||
       condition===""){

        alert("Please fill all required details.");

        return;
    }


    let icons = {
        Electronics:"📱",
        Furniture:"🪑",
        Books:"📚",
        Vehicles:"🚲"
    };


    products.unshift({

        name:name,
        category:category,
        price:Number(price),
        condition:condition,
        description:description,
        icon:icons[category]

    });


    displayProducts(products);


    document.getElementById("productName").value="";
    document.getElementById("productCategory").value="";
    document.getElementById("productPrice").value="";
    document.getElementById("productCondition").value="";
    document.getElementById("productDescription").value="";


    alert("✅ Your product has been listed successfully!");

}


/* GO TO SELL SECTION */

function goSell(){

    document.getElementById("sellSection")
    .scrollIntoView({
        behavior:"smooth"
    });

}


/* INITIAL DISPLAY */

displayProducts(products);

</script>

</body>
</html>
